name: 手动发布 Windows EXE

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 输入 RELEASE 确认发布到 GitHub Releases
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    name: 测试、打包并发布
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"

    steps:
      - name: 验证人工发布确认
        shell: pwsh
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:RELEASE_CONFIRM -cne "RELEASE") {
            throw "必须输入 RELEASE 才能执行发布。"
          }

      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-test.txt

      - name: 读取并校验版本信息
        id: version
        shell: pwsh
        run: |
          $updater = Get-Content -Raw -Encoding UTF8 slashco_updater.py
          if ($updater -notmatch 'APP_VERSION\s*=\s*"(?<version>\d+\.\d+\.\d+)"') {
            throw "无法从 slashco_updater.py 读取 APP_VERSION。"
          }
          $version = $Matches.version

          $readme = Get-Content -Raw -Encoding UTF8 README.md
          if ($readme -notmatch '当前版本：`(?<version>\d+\.\d+\.\d+)`') {
            throw "无法从 README.md 读取当前版本。"
          }
          if ($Matches.version -ne $version) {
            throw "README.md 版本 $($Matches.version) 与程序版本 $version 不一致。"
          }

          $changelog = Get-Content -Raw -Encoding UTF8 CHANGELOG.md
          $escapedVersion = [Regex]::Escape($version)
          $section = [Regex]::Match(
            $changelog,
            "(?ms)^##\s+$escapedVersion\s*\r?\n(?<body>.*?)(?=^##\s+|\z)"
          )
          if (-not $section.Success -or [string]::IsNullOrWhiteSpace($section.Groups['body'].Value)) {
            throw "CHANGELOG.md 缺少版本 $version 的发布说明。"
          }

          $section.Groups['body'].Value.Trim() |
            Set-Content -Encoding UTF8 release-notes.md
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: 创建项目虚拟环境
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements-build.txt -r requirements-test.txt

      - name: 运行完整测试和依赖检查
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe tools/check_repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m pip check

      - name: 构建免安装 EXE 和更新组件
        shell: pwsh
        run: |
          .venv\Scripts\pyinstaller.exe --clean --noconfirm slashco.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\pyinstaller.exe --clean --noconfirm slashco_launcher.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe tools/build_portable.py

      - name: 计算并记录 SHA-256
        shell: pwsh
        run: |
          $exe = Get-Item dist\release\SlashCoSense.exe
          if ($exe.Length -le 0) {
            throw "构建产物为空。"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToUpperInvariant()
          Add-Content -Encoding UTF8 release-notes.md "`nSHA-256：$hash"

      - name: 保存工作流构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SlashCoSense-${{ steps.version.outputs.version }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

      - name: 创建或更新 Release 草稿
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existingJson = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) {
              throw "Release $env:RELEASE_TAG 已经发布，拒绝覆盖正式版本。"
            }
            gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TAG `
              --notes-file release-notes.md
          } else {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TAG `
              --notes-file release-notes.md `
              --draft
          }

      - name: 上传并校验 Release 附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist\release -File)
          $paths = @($files | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @paths `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json assets | ConvertFrom-Json
          foreach ($file in $files) {
            $asset = $release.assets | Where-Object { $_.name -eq $file.Name }
            if ($null -eq $asset -or $asset.state -ne 'uploaded') {
              throw "Release 附件未上传：$($file.Name)"
            }
            if ([int64]$asset.size -ne $file.Length) {
              throw "Release 附件大小不一致：$($file.Name)"
            }
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            if ($asset.digest -ne "sha256:$hash") {
              throw "Release 附件 SHA-256 缺失或不一致：$($file.Name)"
            }
          }

      - name: 正式发布为 Latest Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false `
            --latest
